services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: elocker
      POSTGRES_PASSWORD: elocker
      POSTGRES_DB: elocker_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elocker -d elocker_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://elocker:elocker@db:5432/elocker_development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle:
